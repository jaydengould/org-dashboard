services:
  - type: web
    name: client-portal-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # The app seeds itself at startup (see create_app), so this stays a plain
    # server command and cannot drift out of step with the code.
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORTAL_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DB_PATH
        value: /tmp/portal.db
